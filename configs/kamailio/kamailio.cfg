#!KAMAILIO
# TechLife VoiceBridge Enterprise — Kamailio SIP Proxy
debug=2
log_stderror=no
fork=yes
children=4
listen=udp:SERVERIP:5060
listen=tcp:SERVERIP:5060
alias=SIPDOMAIN
mpath="/usr/lib/x86_64-linux-gnu/kamailio/modules/"
loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "dispatcher.so"
loadmodule "http_client.so"
modparam("dispatcher","list_file","/etc/kamailio/dispatcher.list")
modparam("dispatcher","ds_ping_interval",10)
modparam("dispatcher","ds_ping_method","OPTIONS")
modparam("http_client","connection_timeout",4)
request_route {
    if(!mf_process_maxfwd_header(10)){ sl_send_reply("483","Too Many Hops"); exit; }
    if(!sanity_check("1511","7")){ exit; }
    if(is_method("REGISTER")){ save("location"); exit; }
    if(is_method("OPTIONS")&&uri==myself){ sl_send_reply("200","OK"); exit; }
    if(has_totag()){
        if(loose_route()){ route(RELAY); } else { sl_send_reply("404","Not Found"); }
        exit;
    }
    remove_hf("Route");
    if(is_method("INVITE|SUBSCRIBE")){ record_route(); }
    $var(tenant_hdr) = $hdr(X-Tenant-ID);
    if($var(tenant_hdr) != $null){
        http_client_query("http://127.0.0.1:5000/webhook/"+$var(tenant_hdr)+"/kamailio/mi","event=sip.invite&caller="+$fU+"&callee="+$rU,"$var(api_resp)");
    }
    route(DISPATCH);
}
route[DISPATCH] {
    if(!ds_select_dst("1","4")){
        if(!ds_select_dst("2","4")){ send_reply("503","Service Unavailable"); exit; }
    }
    t_on_failure("RTF_DISPATCH");
    route(RELAY);
}
route[RELAY] {
    if(!t_relay()){ sl_reply_error(); }
    exit;
}
failure_route[RTF_DISPATCH] {
    if(t_is_canceled()) exit;
    if(t_check_status("503")){ if(ds_next_dst()){ route(RELAY); exit; } }
}
