; /etc/asterisk/extensions.conf — TechLife VoiceBridge Enterprise
[globals]
VOICEBRIDGE_API=http://127.0.0.1:4000
VOICEBRIDGE_WH=http://127.0.0.1:5000
TECHLIFE_TENANT=TENANT_ID_HERE

[techlife-inbound]
exten => _X.,1,NoOp(TechLife inbound ${EXTEN} from ${CALLERID(num)})
 same => n,Answer(500)
 same => n,Set(CHANNEL(audioreadformat)=slin16)
 same => n,Set(CHANNEL(audiowriteformat)=slin16)
 same => n,AGI(techlife_agi.py,inbound,${EXTEN},${CALLERID(num)},${TECHLIFE_TENANT})
 same => n,Hangup()

exten => 9000,1,Answer(300)
 same => n,Set(CHANNEL(audioreadformat)=slin16)
 same => n,Set(CHANNEL(audiowriteformat)=slin16)
 same => n,AGI(techlife_agi.py,ai_agent,9000,${CALLERID(num)},${TECHLIFE_TENANT})
 same => n,Hangup()

exten => 7000,1,Answer()
 same => n,Echo()
 same => n,Hangup()

exten => h,1,NoOp(Hangup)
